[package]
name = "tracing-lv"
version = "0.0.2"
edition = "2024"
description = "Track your apps in real time"
license = "MIT"
repository = "https://github.com/ycysdf/tracing-live"

[features]
default = ["tokio", "dep:tracing-lv-core", "dep:tower", "dep:hyper", "dep:hyper-util"]
reconnect_and_persistence = ["dep:zstd", "dep:binrw", "dep:rmp-serde"]
tokio = ["dep:tokio", "tracing-lv-track/tokio"]

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
#smol_str = { version = "0.2", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
flume = "0.11"
serde = { version = "1.0.204", features = ["derive", "std"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
#serde_json = "1"
#async-compression = { version = "0.4", features = ["tokio", "zstd"] }
tokio = { version = "1", optional = true, features = ["io-util", "fs", "time"] }
#portable-atomic = "1.10"
pin-project = "1"
tracing-core = "0.1"
bytes = "1.9.0"
xy-rpc = { path = "../../../xy-rpc", features = ["rt_tokio"] }
derive_more = { version = "1", features = ["full"] }

tracing-lv-track = { path = "../../libs/track" }
tracing-lv-core = { path = "../../crates/core", optional = true, features = ["client", "std"], version = "0.0.2" }
tower = { version = "0.5", optional = true }
hyper = { version = "1.4", features = ["client"], optional = true }
hyper-util = { version = "0.1", optional = true }


rmp-serde = { version = "1.3", optional = true }
binrw = { version = "0.14", optional = true }
zstd = { version = "0.13", features = ["zdict_builder"], default-features = false, optional = true }